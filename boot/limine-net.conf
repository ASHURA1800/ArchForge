# Limine configuration file for ArchForge OS (Network Test Mode)
# See https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md

# Timeout in seconds before auto-booting the default entry
timeout: 3

# Enable serial output for debugging (COM1 at 38400 baud)
serial: yes

# Default entry
default_entry: 1

/ArchForge OS (Network Test)
    protocol: limine
    # Kernel path on the boot partition
    # For ISO:  /boot/kernel.elf
    # For HDD:  /boot/kernel.elf
    path: boot():/boot/kernel.elf
    cmdline: TEST=1 NET_TEST=1